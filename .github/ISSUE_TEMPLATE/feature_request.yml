name: Feature request
description: A feature your application needs.
title: "Feature: "
body:
  - type: markdown
    attributes:
      value: |
        Feature requests and enhancements must come from humans. Requests generated by an LLM will be closed.

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What are you building, and what can't you do with Box2D today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like Box2D to provide? Rough ideas are fine.
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: How are you handling this now, if at all?
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I wrote this request myself.
          required: true
